        .staticrypt-page {

            background: var(--surface) !important;
            border: 1px solid var(--border) !important;

        .staticrypt-hr {
            display: none !important;

        .staticrypt-password-container {
            position: relative !important;
            width: 100% !important;
            margin-bottom: 12px !important;
            border: 1px solid var(--border) !important;
            border-radius: 4px !important;
            background: var(--surface) !important;
        }

        .staticrypt-password-container:focus-within {
            border-color: var(--accent) !important;
        }

        .staticrypt-form input:is([type="password"], [type="text"]) {
            width: 100% !important;
            padding: 12px 40px 12px 12px !important;
            font-size: 1rem !important;
            color: var(--text-primary) !important;
            background: transparent !important;
            border: none !important;
            outline: none !important;
            border-radius: 4px !important;
            user-select: text;
        }

        .staticrypt-form input::placeholder {
            color: var(--text-secondary) !important;
        }

        .staticrypt-toggle-password-visibility {
            position: absolute !important;
            right: 12px !important;
            top: 50% !important;
            transform: translateY(-50%) !important;
            width: 20px !important;
            height: 20px !important;
            cursor: pointer !important;
            opacity: 0.6 !important;
            transition: transform 0.1s ease !important;
        }

        .staticrypt-toggle-password-visibility:active {
            transform: translateY(-50%) scale(0.9) !important;
        }

        label.staticrypt-remember {
            display: flex !important;
            align-items: center !important;
            gap: 8px !important;
            font-size: 0.88rem !important;
            color: var(--text-secondary) !important;
            margin-bottom: 24px !important;
            cursor: pointer !important;

            accent-color: var(--accent) !important;
            width: 16px !important;
            height: 16px !important;
        }

            height: 42px !important;
            background: var(--accent) !important;
            color: #ffffff !important;
            border: none !important;
            border-radius: 4px !important;
            font-size: 0.9rem !important;
            font-weight: 500 !important;
            letter-spacing: 0.5px !important;
            cursor: pointer !important;
            transition: transform 0.1s ease !important;

            background: var(--accent-active) !important;

            border-top: 1px solid var(--border) !important;
            display: flex !important;
            align-items: center !important;
            justify-content: space-between !important;

            align-items: center;

        .staticrypt-spinner {
            width: 32px !important;

            border: 3px solid var(--border) !important;
            border-top-color: var(--accent) !important;

        @keyframes spin {

        .custom-toast {
            position: fixed !important;
            bottom: 24px !important;
            top: auto !important;
            left: 50% !important;
            transform: translate(-50%, 0) !important;
            background: var(--surface) !important;
            color: var(--text-primary) !important;
            border: 1px solid var(--border) !important;
            border-radius: 4px !important;
            padding: 10px 18px !important;
            font-size: 0.85rem !important;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1) !important;
            opacity: 0 !important;
            transition: opacity 0.2s ease !important;
            z-index: 9999 !important;
        }

        .custom-toast.show {

        }

            color: var(--error) !important;
        }

        .shake {
            animation: none !important;
        }

        .hidden {
            display: none !important;
        }
