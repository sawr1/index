                --bg-end: #0f172a;
                --card-bg: rgba(255, 255, 255, 0.04);

                --card-border-focus: rgba(99, 102, 241, 0.5);
                --text-main: #f8fafc;
                --text-sub: #94a3b8;
                --input-bg: rgba(15, 23, 42, 0.6);
            }

            html, body, .staticrypt-body {
                scrollbar-width: none !important;
                -ms-overflow-style: none !important;
            }

            html::-webkit-scrollbar,
            body::-webkit-scrollbar,
            .staticrypt-body::-webkit-scrollbar {
                display: none !important;
            }

            .staticrypt-html {
                height: 100%;
            }

            .staticrypt-body {
                min-height: 100%;
                margin: 0;
                background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, var(--bg-start) 50%, var(--bg-end) 100%) !important;
                color: var(--text-main);
                font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
                display: grid;
                place-items: center;
                overflow-y: auto;
                -webkit-font-smoothing: antialiased;
            }

            .staticrypt-content {
                min-height: 100%;
                width: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .staticrypt-page {
                width: min(420px, 92vw);
                padding: 40px 0;
                margin: auto;
                box-sizing: border-box;
            }

            .staticrypt-form {
                position: relative;
                background: var(--card-bg);
                border: 1px solid var(--card-border);
                border-radius: 24px;
                padding: 40px 32px;
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
                box-shadow: 
                    0 20px 50px rgba(0, 0, 0, 0.4),
                    inset 0 1px 0 rgba(255, 255, 255, 0.1);
            }

            .staticrypt-title {
                font-size: 1.6rem;
                font-weight: 700;
                letter-spacing: -0.02em;
                margin: 0 0 8px 0;
                background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
            }

            .staticrypt-instructions {
                font-size: 0.92rem;
                color: var(--text-sub);
                margin: 0 0 24px 0;
                font-weight: 400;
                line-height: 1.5;
            }

            .staticrypt-hr {
                margin: 24px 0;
                border: 0;
                height: 1px;
                background: linear-gradient(90deg, transparent, var(--card-border), transparent);
            }

            .staticrypt-password-container {
                position: relative;
                width: 100%;
                margin-bottom: 20px;
                border-radius: 14px;
                background: var(--input-bg);
                border: 1px solid var(--card-border);
                transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            }

            .staticrypt-password-container:focus-within {
                border-color: var(--card-border-focus);
                box-shadow: 0 0 0 4px var(--primary-glow);
            }

            .staticrypt-form input:is([type="password"], [type="text"]) {
                background: transparent;
                border: none;
                outline: none;
                color: var(--text-main);
                font-size: 15px;
                font-family: inherit;
                padding: 16px 45px 16px 16px;
                width: 100%;
                box-sizing: border-box;
            }

            .staticrypt-form input::placeholder {
                color: #64748b;
            }

            .staticrypt-toggle-password-visibility {
                position: absolute;
                inset-inline-end: 14px;
                top: 50%;
                transform: translateY(-50%);
                width: 20px;
                height: 20px;
                cursor: pointer;
                opacity: 0.5;
                filter: invert(1);
                transition: opacity 0.2s ease;
            }

            .staticrypt-toggle-password-visibility:hover {
                opacity: 0.9;
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                gap: 10px;
                font-size: 0.88rem;
                color: var(--text-sub);
                margin-bottom: 24px;
                cursor: pointer;
                user-select: none;
            }

            .staticrypt-remember input[type="checkbox"] {
                appearance: none;
                -webkit-appearance: none;
                width: 18px;
                height: 18px;
                border: 1px solid var(--card-border);
                border-radius: 6px;
                background: var(--input-bg);
                margin: 0;
                display: grid;
                place-content: center;
                cursor: pointer;
                transition: all 0.2s ease;
            }

            .staticrypt-remember input[type="checkbox"]:checked {
                background: var(--primary);
                border-color: var(--primary);
            }

            .staticrypt-remember input[type="checkbox"]:checked::before {
                content: "";
                width: 8px;
                height: 4px;
                border-left: 2px solid white;
                border-bottom: 2px solid white;
                transform: rotate(-45deg) translate(1px, -1px);
            }

            .staticrypt-form .staticrypt-decrypt-button {
                position: relative;
                width: 100%;
                padding: 16px;
                border: none;
                border-radius: 14px;
                background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
                color: #ffffff;
                font-size: 15px;
                font-weight: 600;
                font-family: inherit;
                letter-spacing: 0.02em;
                cursor: pointer;
                box-shadow: 0 10px 25px -5px var(--primary-glow);
                transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
                outline: none;
            }

            @media (hover: hover) {
                .staticrypt-form .staticrypt-decrypt-button:hover {
                    transform: translateY(-2px);
                    box-shadow: 0 14px 30px -4px var(--primary-glow);
                    filter: brightness(110%);
                }
            }

            .staticrypt-form .staticrypt-decrypt-button:active {
                transform: scale(0.98);
                filter: brightness(90%);
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-spinner-container {
                height: 100%;
                display: grid;
                place-items: center;
            }

            .staticrypt-spinner {
                width: 2.2rem;
                height: 2.2rem;
                border: 2px solid rgba(255, 255, 255, 0.1);
                border-top-color: var(--primary);
                border-radius: 50%;
                animation: spin 0.8s cubic-bezier(0.6, 0.2, 0.4, 0.8) infinite;
            }

            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }
            .tmp {
                margin-top: 32px;
                padding-top: 20px;
                border-top: 1px solid var(--card-border);
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 10px;
                text-align: center;
            }
            .tmp p#think,
            .tmp p#sell {
                margin: 0;
                font-size: 0.85rem;
                color: var(--text-sub);
                letter-spacing: 0.02em;

            .tmp p#sell {
                margin-top: 8px;
            }
            .tmp button#Moisson,

                display: inline-flex;
                align-items: center;
                justify-content: center;
                background: rgba(255, 255, 255, 0.06);
                border: 1px solid var(--card-border);
                color: var(--text-main);
                padding: 8px 18px;
                border-radius: 9999px;
                font-size: 0.8rem;
                font-weight: 500;
                font-family: inherit;
                cursor: pointer;
                outline: none;
                backdrop-filter: blur(8px);
                -webkit-backdrop-filter: blur(8px);
                transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            }
            @media (hover: hover) {
                .tmp button#Moisson:hover,

                    background: rgba(255, 255, 255, 0.12);
                    border-color: rgba(255, 255, 255, 0.25);
                    transform: translateY(-1px);
                }
            }
            .tmp button#Moisson:active,
            .tmp button#Myaccount:active {
                transform: scale(0.96);
                background: rgba(255, 255, 255, 0.04);
            }

                const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);
