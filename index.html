        <style>
            :root {
                --primary: #6366f1;
                --primary-hover: #4f46e5;
                --primary-active: #4338ca;
                --primary-glow: rgba(99, 102, 241, 0.45);
                --primary-glow-strong: rgba(99, 102, 241, 0.7);
                
                --bg-start: #080c14;
                --bg-mid: #0b1120;
                --bg-end: #0f172a;
                
                --card-bg: rgba(15, 23, 42, 0.65);
                --card-border: rgba(255, 255, 255, 0.08);
                --card-border-focus: rgba(99, 102, 241, 0.65);
                
                --text-main: #f8fafc;
                --text-sub: #94a3b8;
                --text-muted: #64748b;
                
                --input-bg: rgba(8, 12, 22, 0.85);
                --input-hover: rgba(15, 23, 42, 0.95);
            }

            *, *::before, *::after {
                box-sizing: border-box !important;
            }

            html, body {
                width: 100% !important;
                max-width: 100vw !important;
                height: 100%;
                margin: 0;
                padding: 0;
                overflow-x: hidden !important;
            }

            .staticrypt-html {
                height: 100%;
            }

            html, body, .staticrypt-body {
                scrollbar-width: thin !important;
                scrollbar-color: rgba(255, 255, 255, 0.22) #080c14 !important;
            }

            html::-webkit-scrollbar,
            body::-webkit-scrollbar,
            .staticrypt-body::-webkit-scrollbar {
                width: 10px !important;
                height: 10px !important;
                display: block !important;
            }

            html::-webkit-scrollbar-track,
            body::-webkit-scrollbar-track,
            .staticrypt-body::-webkit-scrollbar-track {
                background: #080c14 !important;
            }

            html::-webkit-scrollbar-thumb,
            body::-webkit-scrollbar-thumb,
            .staticrypt-body::-webkit-scrollbar-thumb {
                background: rgba(255, 255, 255, 0.22) !important;
                border-radius: 9999px !important;
                border: 2px solid #080c14 !important; 
                transition: background-color 0.2s ease !important;
            }

            html::-webkit-scrollbar-thumb:hover,
            body::-webkit-scrollbar-thumb:hover,
            .staticrypt-body::-webkit-scrollbar-thumb:hover {
                background: rgba(255, 255, 255, 0.4) !important;
            }

            .staticrypt-body {
                min-height: 100%;
                position: relative;
                background-color: var(--bg-start) !important;
                background-image: 
                    radial-gradient(at 50% 0%, rgba(99, 102, 241, 0.2) 0px, transparent 65%),
                    radial-gradient(at 100% 100%, rgba(56, 189, 248, 0.08) 0px, transparent 55%),
                    radial-gradient(at 0% 100%, rgba(139, 92, 246, 0.1) 0px, transparent 55%),
                    radial-gradient(circle at 50% 50%, var(--bg-mid) 0%, var(--bg-end) 100%) !important;
                color: var(--text-main);
                font-family: 'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif;
                display: grid;
                place-items: center;
                overflow-y: auto;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            .staticrypt-body::before {
                content: "";
                position: fixed;
                inset: 0;
                background-image: radial-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px);
                background-size: 28px 28px;
                mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, #000 30%, transparent 100%);
                -webkit-mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, #000 30%, transparent 100%);
                pointer-events: none;
                z-index: 0;
            }

            .staticrypt-content {
                min-height: 100%;
                width: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                position: relative;
                z-index: 1;
                padding: 40px 16px;
            }

            .staticrypt-page {
                width: 100%;
                max-width: 440px;
                margin: auto;
                position: relative;
            }

            .staticrypt-form {
                position: relative;
                background: var(--card-bg);
                border: 1px solid var(--card-border);
                border-radius: 24px;
                padding: 40px 32px;
                backdrop-filter: blur(28px) saturate(180%);
                -webkit-backdrop-filter: blur(28px) saturate(180%);

                    0 25px 50px -12px rgba(0, 0, 0, 0.6),
                    0 0 0 1px rgba(255, 255, 255, 0.04) inset;
                transition: transform 0.3s ease, box-shadow 0.3s ease;
                overflow: hidden; 
            }

            .staticrypt-form:hover {
                box-shadow: 
                    0 30px 60px -12px rgba(0, 0, 0, 0.75),
                    0 0 25px -4px rgba(99, 102, 241, 0.15),
                    0 0 0 1px rgba(255, 255, 255, 0.06) inset;
            }

            .staticrypt-form::before {
                display: none !important;
            }

            .staticrypt-title {
                font-size: 1.65rem;
                font-weight: 800;
                letter-spacing: -0.03em;
                margin: 0 0 8px 0;
                background: linear-gradient(180deg, #ffffff 20%, #94a3b8 100%);
                -webkit-background-clip: text;
                -webkit-background-clip: text;
                background-clip: text;
                -webkit-text-fill-color: transparent;
            }

            .staticrypt-instructions {
                font-size: 0.9rem;
                color: var(--text-sub);
                margin: 0 0 20px 0;
                font-weight: 400;
                line-height: 1.55;

                margin: 22px 0 24px 0;
                border: none !important;
                height: 1px !important;
                background: rgba(255, 255, 255, 0.06) !important;

                position: relative;
                width: 100%;
                margin-bottom: 20px;
                border-radius: 14px !important;
                background: var(--input-bg);
                border: 1px solid var(--card-border);
                box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.3);
                transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
                overflow: hidden !important;
                -webkit-mask-image: -webkit-radial-gradient(white, black) !important;
                mask-image: radial-gradient(white, black) !important;
            }

            .staticrypt-password-container:hover {
                background: var(--input-hover);
                border-color: rgba(255, 255, 255, 0.16);
            }

            .staticrypt-password-container:focus-within {
                background: var(--input-hover);
                border-color: var(--card-border-focus);
                box-shadow: 
                    0 0 0 3px var(--primary-glow),
                    inset 0 2px 6px rgba(0, 0, 0, 0.4);
            }

            .staticrypt-form input:is([type="password"], [type="text"]) {
                background: transparent !important;
                border: none !important;
                outline: none !important;
                color: var(--text-main) !important;
                font-size: 15px;
                font-family: 'JetBrains Mono', 'Plus Jakarta Sans', monospace;
                letter-spacing: 0.04em;
                padding: 15px 46px 15px 16px;
                width: 100%;
                box-sizing: border-box;
                border-radius: 14px !important;
            }

            .staticrypt-form input::placeholder {
                color: var(--text-muted);
                font-family: 'Plus Jakarta Sans', sans-serif;
                letter-spacing: 0;
            }

            .staticrypt-form input:-webkit-autofill,
            .staticrypt-form input:-webkit-autofill:hover, 
            .staticrypt-form input:-webkit-autofill:focus, 
            .staticrypt-form input:-webkit-autofill:active {
                -webkit-box-shadow: 0 0 0 1000px #080c14 inset !important;
                box-shadow: 0 0 0 1000px #080c14 inset !important;
                -webkit-text-fill-color: #f8fafc !important;
                caret-color: #f8fafc !important;
                transition: background-color 99999s ease-in-out 0s !important;
                border-radius: 14px !important;
            }

            .staticrypt-toggle-password-visibility {
                position: absolute;
                inset-inline-end: 14px;
                top: 50%;
                transform: translateY(-50%);
                width: 20px;
                height: 20px;
                cursor: pointer;
                opacity: 0.45;
                filter: invert(1);
                transition: opacity 0.2s ease, transform 0.2s ease;
            }

            .staticrypt-toggle-password-visibility:hover {
                opacity: 0.95;
                transform: translateY(-50%) scale(1.1);
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                gap: 10px;
                font-size: 0.88rem;
                color: var(--text-sub);
                margin-bottom: 24px;
                cursor: pointer;
                user-select: none;
            }

            label.staticrypt-remember:hover {
                color: var(--text-main);
            }

            .staticrypt-remember input[type="checkbox"] {
                appearance: none;
                -webkit-appearance: none;
                width: 18px;
                height: 18px;
                border: 1px solid var(--card-border);
                border-radius: 6px;
                background: var(--input-bg);
                margin: 0;
                display: grid;
                place-content: center;
                cursor: pointer;
                transition: all 0.2s ease;
            }

            .staticrypt-remember input[type="checkbox"]:checked {
                background: var(--primary);
                border-color: var(--primary);
                box-shadow: 0 0 10px var(--primary-glow);
            }

            .staticrypt-remember input[type="checkbox"]:checked::before {
                content: "";
                width: 8px;
                height: 4px;
                border-left: 2px solid white;
                border-bottom: 2px solid white;
                transform: rotate(-45deg) translate(1px, -1px);
            }

            .staticrypt-form .staticrypt-decrypt-button {
                position: relative;
                width: 100%;
                padding: 15px 20px;
                border: none;
                border-radius: 14px;
                background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
                color: #ffffff;
                font-size: 15px;
                font-weight: 700;
                font-family: inherit;
                letter-spacing: 0.04em;
                cursor: pointer;
                box-shadow: 0 8px 20px -3px var(--primary-glow);
                transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
                outline: none;
            }

            @media (hover: hover) {
                .staticrypt-form .staticrypt-decrypt-button:hover {
                    transform: translateY(-2px);
                    box-shadow: 0 12px 26px -3px var(--primary-glow-strong);
                    filter: brightness(110%);
                }
            }

            .staticrypt-form .staticrypt-decrypt-button:active {
                transform: translateY(1px) scale(0.98);
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-spinner-container {
                height: 100%;
                display: grid;
                place-items: center;
            }

            .staticrypt-spinner {
                width: 2.5rem;
                height: 2.5rem;
                border: 2.5px solid rgba(255, 255, 255, 0.08);
                border-top-color: var(--primary);
                border-radius: 50%;
                animation: spin 0.85s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite;
            }

            @keyframes spin {
                to { transform: rotate(360deg); }
            }

                margin-top: 28px;

                border-top: 1px solid rgba(255, 255, 255, 0.06);

                flex-direction: column;

                margin: 0;
                font-size: 0.82rem;
                color: var(--text-muted);
                letter-spacing: 0.02em;
            }

            .tmp p#sell {
                margin-top: 8px;
            }

            .tmp button#Moisson, .tmp button#Myaccount {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                background: rgba(255, 255, 255, 0.04);
                border: 1px solid rgba(255, 255, 255, 0.08);
                color: var(--text-sub);
                padding: 6px 16px;
                border-radius: 9999px;
                font-size: 0.8rem;
                font-weight: 500;
                font-family: inherit;
                cursor: pointer;
                outline: none;
                transition: all 0.2s ease;
            }

            @media (hover: hover) {
                .tmp button#Moisson:hover, .tmp button#Myaccount:hover {
                    background: rgba(255, 255, 255, 0.09);
                    border-color: rgba(255, 255, 255, 0.2);
                    color: var(--text-main);
                    transform: translateY(-1px);
                }
            }

            .custom-toast {
                position: fixed !important;
                top: 36px !important;
                left: 50% !important;
                transform: translate(-50%, -24px) scale(0.92) !important;
                backdrop-filter: blur(28px) saturate(190%) !important;
                -webkit-backdrop-filter: blur(28px) saturate(190%) !important;
                padding: 11px 24px !important;
                border-radius: 9999px !important;
                font-size: 0.88rem !important;
                font-weight: 600 !important;
                letter-spacing: 0.02em !important;
                opacity: 0 !important;
                pointer-events: none !important;
                transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1) !important;
                z-index: 999999 !important;
                display: inline-flex !important;
                align-items: center !important;
                justify-content: center !important;
                gap: 10px !important;
                white-space: nowrap !important;
                box-sizing: border-box !important;
            }

            .custom-toast.show {
                opacity: 1 !important;
                transform: translate(-50%, 0) scale(1) !important;
            }

            .custom-toast.info {
                background: rgba(30, 27, 75, 0.85) !important;
                border: 1px solid rgba(129, 140, 248, 0.45) !important;
                color: #e0e7ff !important;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            }

            .custom-toast.error {
                background: rgba(69, 10, 10, 0.85) !important;
                border: 1px solid rgba(248, 113, 113, 0.45) !important;
                color: #fee2e2 !important;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            }

            .shake {
                animation: card-shake 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) both !important;
            }

            @keyframes card-shake {
                0%, 100% { transform: translate3d(0, 0, 0); }
                15%, 45%, 75% { transform: translate3d(-6px, 0, 0); }
                30%, 60%, 90% { transform: translate3d(6px, 0, 0); }
            }

            #cpu-matrix-canvas {
                position: fixed;
                top: 0;
                left: 0;
                width: 100% !important;
                height: 100% !important;
                z-index: 0;
                pointer-events: none;
            }
            .swal-custom-popup {
                border: 1px solid rgba(255, 255, 255, 0.1) !important;
                border-radius: 24px !important;
                backdrop-filter: blur(24px) saturate(180%) !important;
                -webkit-backdrop-filter: blur(24px) saturate(180%) !important;
                box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), 0 0 30px -5px rgba(99, 102, 241, 0.2) !important;
            }

            .swal-custom-confirm {
                background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%) !important;
                color: #ffffff !important;
                font-family: 'Plus Jakarta Sans', sans-serif !important;
                font-size: 13px !important;
                font-weight: 700 !important;
                letter-spacing: 0.05em !important;
                padding: 12px 28px !important;
                border-radius: 12px !important;
                cursor: pointer !important;
                box-shadow: 0 6px 18px -2px rgba(99, 102, 241, 0.5) !important;
                transition: all 0.2s ease !important;
            }

            .swal-custom-confirm:hover {
                transform: translateY(-1px) !important;
                filter: brightness(1.1) !important;
                box-shadow: 0 10px 22px -2px rgba(99, 102, 241, 0.7) !important;
            }
        </style>
    </head>
